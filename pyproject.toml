[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doctomd-suite"
version = "0.1.0"
description = "Convert Microsoft Word documents to Markdown and Markdown back to DOCX"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Ismail Azzouz"}]
keywords = ["word", "docx", "markdown", "converter", "ooxml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business",
]
dependencies = [
    "lxml>=5.0,<7",
    "markdown-it-py>=3.0,<5",
    "mdit-py-plugins>=0.4,<1",
]

[project.optional-dependencies]
images = ["Pillow>=10"]
dev = ["pytest>=8", "build>=1", "twine>=5"]

[project.scripts]
doc2md = "doctomd.cli:main"
md2docx = "mdtodoc.cli:main"

[project.urls]
Homepage = "https://github.com/IsmailAzzouz/Doc2Md"
Repository = "https://github.com/IsmailAzzouz/Doc2Md"
Issues = "https://github.com/IsmailAzzouz/Doc2Md/issues"
Changelog = "https://github.com/IsmailAzzouz/Doc2Md/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["doctomd", "mdtodoc"]
py-modules = ["doc2md", "md2docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

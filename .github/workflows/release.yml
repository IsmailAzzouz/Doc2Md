name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest # GitHub-hosted Docker host; all steps execute in Alpine.
    container: python:3.11-alpine
    permissions:
      contents: write
    steps:
      - name: Install Git and GitHub CLI
        run: apk add --no-cache git github-cli
      - uses: actions/checkout@v4
      - name: Verify tag version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          expected = f'v{version}'
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'Tag {actual} must match project version {expected}')
          PY
      - name: Test and build release
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir '.[dev]'
          python -m pytest -q
          python -m build
          python -m twine check dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest # GitHub-hosted Docker host; all steps execute in Alpine.
    container: python:3.11-alpine
    steps:
      - name: Install Git
        run: apk add --no-cache git
      - uses: actions/checkout@v4
      - name: Test and validate package
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir '.[dev]'
          python -m pytest -q
          python -m build
          python -m twine check dist/*
